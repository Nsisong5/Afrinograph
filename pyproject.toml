[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afrinograph"
version = "0.1.0"
description = "Africa Knowledge Graph - Africa Signal Collector V1"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.2",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/afrinograph"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: Unit tests (no DB, no network)",
    "contract: Contract compliance tests",
    "integration: Integration tests (requires local PostgreSQL)",
    "api: API endpoint tests",
    "architecture: Architecture boundary tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
